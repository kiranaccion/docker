name: Trivy Security Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # Install Trivy
      # ----------------------------
      - name: Install Trivy CLI
        uses: ankurk91/install-trivy-cli-action@v2
        with:
          version: latest
          cache: true

      # ----------------------------
      # Download html.tpl (REQUIRED)
      # ----------------------------
      - name: Download Trivy HTML template
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl" `
            -OutFile "$env:GITHUB_WORKSPACE/html.tpl"

      # ----------------------------
      # Run Trivy Scan (HTML report)
      # ----------------------------
      - name: Run Trivy scan
        shell: pwsh
        run: |
          docker pull hello-world

          trivy image `
            --severity CRITICAL `
            --exit-code 0 `
            --format template `
            --template "@$env:GITHUB_WORKSPACE/html.tpl" `
            -o "$env:GITHUB_WORKSPACE/trivy-report.html" `
            hello-world

      # ----------------------------
      # Upload Report
      # ----------------------------
      - name: Upload Trivy HTML report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-html-report
          path: ${{ github.workspace }}/trivy-report.html
