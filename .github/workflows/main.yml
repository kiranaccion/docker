name: Trivy Security Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout source code
      # ----------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # Install Trivy
      # ----------------------------
      - name: Install Trivy CLI
        uses: ankurk91/install-trivy-cli-action@v2
        with:
          version: latest
          cache: true

      # ----------------------------
      # Create template + Scan image
      # ----------------------------
      - name: Run Trivy scan on container image
        shell: pwsh
        run: |
          Write-Host "Creating Trivy template..."

          $template = @"
          {{- if .Results }}
          TRIVY SECURITY REPORT
          =====================

          {{- range .Results }}
          Target: {{ .Target }}
          Type: {{ .Type }}

          {{- if .Vulnerabilities }}
          VULNERABILITIES:
          {{- range .Vulnerabilities }}
          ----------------------------------------
          ID:        {{ .VulnerabilityID }}
          Package:   {{ .PkgName }}
          Installed: {{ .InstalledVersion }}
          Fixed:     {{ .FixedVersion }}
          Severity:  {{ .Severity }}
          Title:     {{ .Title }}
          {{- end }}
          {{- else }}
          No vulnerabilities found.
          {{- end }}

          {{ end }}
          {{- else }}
          No scan results.
          {{- end }}
          "@

          $templatePath = "$env:GITHUB_WORKSPACE/trivy-template.tpl"
          $reportPath   = "$env:GITHUB_WORKSPACE/trivy-report.txt"

          Set-Content -Path $templatePath -Value $template

          Write-Host "Pulling test image..."
          docker pull hello-world

          Write-Host "Running Trivy scan..."
          trivy image `
            --severity CRITICAL `
            --exit-code 1 `
            --format template `
            --template "@$templatePath" `
            -o $reportPath `
            hello-world

      # ----------------------------
      # Upload report
      # ----------------------------
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: $reportPath
