name: Trivy Scan

on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t trivy-demo:latest .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: trivy-demo:latest
          severity: HIGH,CRITICAL
          exit-code: 1
